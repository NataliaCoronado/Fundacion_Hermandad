services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      TZ: America/Santiago
      PORT: 3000
      PORT_PERSONAL: 3001
      URL_PORTAL: http://localhost:3000
      DATABASE_URL: postgres://hermandad:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (copia .env.example)}@db:5432/hermandad
      NODE_ENV: ${NODE_ENV:-development}
      CLAVE_DEMO: ${CLAVE_DEMO:-}
      DIR_DOCUMENTOS: /app/datos/documentos
    volumes:
      - adjuntos:/app/datos
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermandad
      POSTGRES_USER: hermandad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (copia .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermandad -d hermandad"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./base-de-datos/01_estructura.sql:/docker-entrypoint-initdb.d/01_hermandad.sql:ro
      - ./base-de-datos/02_datos_ejemplo.sql:/docker-entrypoint-initdb.d/02_datos_ejemplo.sql:ro
      - ./base-de-datos/03_credenciales.sql:/docker-entrypoint-initdb.d/03_credenciales.sql:ro
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
  adjuntos:
