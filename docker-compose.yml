services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      TZ: America/Santiago
      PORT: 3000
      PORT_PERSONAL: 3001
      URL_PORTAL: http://localhost:3000
      DATABASE_URL: postgres://hermandad:cambiar_en_local@db:5432/hermandad
      CLAVE_DEMO: demo1234
      DIR_DOCUMENTOS: /app/datos/documentos
    volumes:
      - adjuntos:/app/datos
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermandad
      POSTGRES_USER: hermandad
      POSTGRES_PASSWORD: cambiar_en_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermandad -d hermandad"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./db/hermandad_postgresql.sql:/docker-entrypoint-initdb.d/01_hermandad.sql:ro
      - ./db/datos_ejemplo.sql:/docker-entrypoint-initdb.d/02_datos_ejemplo.sql:ro
      - ./db/03_credencial.sql:/docker-entrypoint-initdb.d/03_credencial.sql:ro
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
  adjuntos:
